services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webhook_processor_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  sidekiq:
    build: .
    command: bundle exec sidekiq
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      # Component vars (not DATABASE_URL/REDIS_URL): Rails lets DATABASE_URL override every
      # environment, which would point specs run in this container at the dev database.
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && rails db:create db:migrate && rails server -b 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      # Component vars (not DATABASE_URL/REDIS_URL): Rails lets DATABASE_URL override every
      # environment, which would point specs run in this container at the dev database.
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      API_KEY: ${API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN}

volumes:
  postgres_data:
  redis_data:
